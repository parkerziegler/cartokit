name: cartokit CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    env:
      PUBLIC_MAPTILER_API_KEY: ci
      VERCEL_ENV: development
      OPENAI_API_KEY: ci
      CLOUDFLARE_ACCOUNT_ID: ci
      CLOUDFLARE_API_TOKEN: ci
      KV_NAMESPACE_ID: ci
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      - name: Lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test
